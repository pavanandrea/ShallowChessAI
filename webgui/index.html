<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Play with ShallowChessAI</title>
</head>
<body>
    <header id="header">
        ShallowChessAI
        &ensp;
        <input type="submit" value="Start New Game" id="restartButton" />
    </header>
    <div id="content">
        <div style="display: flex; justify-content: space-between;">
            <div style="margin-left: 0;">
                Model:
                &ensp;
                <select id="modelSelector">
                    <option value="random_move" selected>random</option>
                    <option value="pretrained_2311_24k">pretrained-2311-24k</option>
                </select>
            </div>
            <div style="margin-right: 0;">
                Depth:
                &ensp;
                <select id="depthSelector" disabled>
                    <option value="0" selected>0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
        </div>
        <div id="gameboard">
            <div class="square square-white" id="square0"></div>
            <div class="square square-black" id="square1"></div>
            <div class="square square-white" id="square2"></div>
